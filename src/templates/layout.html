<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{documentTitle}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="generator" content="ArraySubs Docs Generator" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="{{documentTitle}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="{{ogType}}" />
    <meta property="og:url" content="{{pageUrl}}" />
    <meta property="og:image" content="{{ogImageUrl}}" />
    <meta name="twitter:card" content="{{twitterCard}}" />
    <meta name="twitter:title" content="{{documentTitle}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImageUrl}}" />
    <link rel="canonical" href="{{canonicalUrl}}" />
    <link rel="icon" href="{{faviconHref}}" />
    <link
      rel="preload"
      href="{{bodyFontHref}}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="{{headingFontHref}}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="{{styleHref}}" />
  </head>
  <body class="{{bodyClass}}">
    <div id="accessibility-widget-host">
      {{header}}
      <div class="docs-shell container">
        <aside
          class="docs-shell__sidebar docs-sidebar"
          id="docs-sidebar"
          aria-label="Sidebar"
        >
          {{sidebar}}
        </aside>
        <button
          class="docs-shell__overlay"
          type="button"
          hidden
          aria-label="Close navigation"
          data-sidebar-overlay
        ></button>
        <main class="docs-shell__main" id="main-content">
          {{breadcrumb}}
          <article class="docs-article" aria-labelledby="page-title">
            <header class="docs-page-header">
              <div class="docs-page-header__title-row">
                <h1 class="docs-page-header__title" id="page-title">
                  {{pageTitle}}
                </h1>
                {{pageBadge}}
              </div>
            </header>
            <div class="docs-content">{{contentHtml}}</div>
            {{footer}}
          </article>
        </main>
        <aside class="docs-shell__toc docs-toc-panel" aria-label="On this page">
          {{toc}}
        </aside>
      </div>
    </div>
    <script src="{{scriptHref}}" defer></script>
    <script type="module">
      import mermaid from "{{mermaidHref}}";

      function getCssVar(name, fallback) {
        var value = getComputedStyle(document.documentElement)
          .getPropertyValue(name)
          .trim();

        return value || fallback;
      }

      function getMermaidOptions() {
        var surface = getCssVar("--docs-surface", "#ffffff");
        var surfaceMuted = getCssVar("--docs-surface-muted", "#f1f5f9");
        var accent = getCssVar("--docs-primary", "#c2410c");
        var accentSoft = getCssVar("--docs-primary-soft", "#fff1e8");

        return {
          startOnLoad: false,
          theme: "base",
          fontFamily: getCssVar(
            "--docs-font",
            '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
          ),
          themeVariables: {
            background: surface,
            mainBkg: surface,
            secondBkg: surfaceMuted,
            primaryColor: accent,
            primaryBorderColor: accent,
            primaryTextColor: "#ffffff",
            lineColor: getCssVar("--docs-text-muted", "#526377"),
            textColor: getCssVar("--docs-text", "#12002b"),
            tertiaryColor: accentSoft,
            clusterBkg: accentSoft,
            clusterBorder: accent,
            noteBkgColor: accentSoft,
            noteTextColor: getCssVar("--docs-text", "#12002b"),
            edgeLabelBackground: surface,
            fontFamily: getCssVar(
              "--docs-font",
              '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            ),
          },
        };
      }

      function rerenderMermaid() {
        document.querySelectorAll("pre.mermaid").forEach(function (el) {
          var raw = el.getAttribute("data-mermaid-src");

          if (raw) {
            el.removeAttribute("data-processed");
            el.innerHTML = raw;
          }
        });

        mermaid.run({ querySelector: "pre.mermaid" });
      }

      document.querySelectorAll("pre.mermaid").forEach(function (el) {
        el.setAttribute("data-mermaid-src", el.textContent);
      });

      mermaid.initialize(getMermaidOptions());
      rerenderMermaid();
    </script>
    <!-- Google Tag Manager: loaded after qualified page engagement -->
    <script>
      (function () {
        var gtmLoaded = false;
        var includeBdVisits = {{includeBdVisits}};
        var engagementDelayMs = 5000;

        function isBrowserUtcPlusSix() {
          return new Date().getTimezoneOffset() === -360;
        }

        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;

          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({
              "gtm.start": new Date().getTime(),
              event: "gtm.js",
              page_location: window.location.href,
              page_path: window.location.pathname + window.location.search,
              page_title: document.title,
            });
            var j = d.createElement(s);
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + "&l=" + l;
            d.body.appendChild(j);
          })(window, document, "script", "dataLayer", "GTM-WJJLFRQ4");
        }

        function startEngagementGate() {
          if (!includeBdVisits && isBrowserUtcPlusSix()) return;

          var hasScrolled = false;
          var hasMovedMouse = false;
          var hasWaited = false;
          var hasTriggered = false;
          var delayTimer;

          function cleanup() {
            window.removeEventListener("scroll", handleScroll);
            window.removeEventListener("mousemove", handleMouseMove);
            window.clearTimeout(delayTimer);
          }

          function maybeLoadGTM() {
            if (
              hasTriggered ||
              !hasScrolled ||
              !hasMovedMouse ||
              !hasWaited
            ) {
              return;
            }

            hasTriggered = true;
            cleanup();
            loadGTM();
          }

          function handleScroll() {
            hasScrolled = true;
            maybeLoadGTM();
          }

          function handleMouseMove() {
            hasMovedMouse = true;
            maybeLoadGTM();
          }

          window.addEventListener("scroll", handleScroll, { passive: true });
          window.addEventListener("mousemove", handleMouseMove, { passive: true });

          delayTimer = window.setTimeout(function () {
            hasWaited = true;
            maybeLoadGTM();
          }, engagementDelayMs);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startEngagementGate, {
            once: true,
          });
        } else {
          startEngagementGate();
        }
      })();
    </script>
    <!-- End Google Tag Manager -->
    <script src="{{accessibilityWidgetConfigHref}}" defer></script>
    <script src="{{accessibilityWidgetScriptHref}}" defer></script>
  </body>
</html>
